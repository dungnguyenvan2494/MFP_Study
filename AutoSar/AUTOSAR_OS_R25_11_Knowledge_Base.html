<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUTOSAR OS R25-11 — Knowledge Base</title>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#0b1020;
  --sidebar:#111827;
  --card:#151c2f;
  --card-hover:#1a2338;
  --primary:#60a5fa;
  --primary-dim:#3b6ba8;
  --secondary:#34d399;
  --warning:#fbbf24;
  --danger:#f87171;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --code:#0f172a;
  --border:#232b42;
  --border-soft:#1c2338;
  --radius:10px;
  --radius-sm:6px;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --serif: Georgia, "Times New Roman", serif;
  --maxw: 880px;
  --header-h: 56px;
  --sidebar-w: 280px;
}
html[data-theme="light"]{
  --bg:#f7f8fb;
  --sidebar:#ffffff;
  --card:#ffffff;
  --card-hover:#f1f5f9;
  --primary:#2563eb;
  --primary-dim:#93c5fd;
  --secondary:#059669;
  --warning:#b45309;
  --danger:#dc2626;
  --text:#0f172a;
  --muted:#5b6474;
  --code:#0f172a;
  --border:#e2e8f0;
  --border-soft:#eef1f6;
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth; scroll-padding-top: calc(var(--header-h) + 12px);}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{ background: var(--primary); color:#0b1020; }
a{ color:var(--primary); text-decoration:none; }
a:hover{ text-decoration:underline; }
code, pre, .mono{ font-family:var(--mono); }
h1,h2,h3,h4{ font-weight:650; line-height:1.25; letter-spacing:-0.01em; }
p{ margin:0 0 12px; color:var(--text); }
.muted{ color:var(--muted); }
button{ font-family:inherit; cursor:pointer; }
:focus-visible{ outline: 2px solid var(--primary); outline-offset:2px; }

/* ============================================================
   LAYOUT
   ============================================================ */
#app{ display:flex; flex-direction:column; min-height:100vh; }

header#top{
  position:sticky; top:0; z-index:60; height:var(--header-h);
  display:flex; align-items:center; gap:16px;
  padding:0 16px; background:rgba(11,16,32,0.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
html[data-theme="light"] header#top{ background:rgba(255,255,255,0.92); }
#brand{ display:flex; align-items:baseline; gap:8px; white-space:nowrap; font-weight:700; }
#brand .ver{ color:var(--primary); font-family:var(--mono); font-size:12px; padding:2px 6px; border:1px solid var(--border); border-radius:5px; }
#menuBtn{ display:none; background:none; border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm); width:34px; height:34px; }
#searchWrap{ flex:1; max-width:420px; position:relative; }
#searchInput{
  width:100%; background:var(--card); border:1px solid var(--border); color:var(--text);
  padding:8px 12px 8px 32px; border-radius:var(--radius-sm); font-size:13.5px;
}
#searchWrap::before{ content:"⌕"; position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:15px; }
#searchResults{
  position:absolute; top:calc(100% + 6px); left:0; right:0; max-height:70vh; overflow:auto;
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:0 12px 32px rgba(0,0,0,.4);
  display:none; z-index:80;
}
#searchResults.show{ display:block; }
.sr-group{ padding:8px 12px 2px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
.sr-item{ display:block; padding:8px 14px; border-top:1px solid var(--border-soft); font-size:13.5px; }
.sr-item:hover{ background:var(--card-hover); text-decoration:none; }
.sr-item b{ color:var(--primary); }
#headerActions{ display:flex; align-items:center; gap:8px; margin-left:auto; }
.iconbtn{ background:none; border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm); width:34px; height:34px; display:flex; align-items:center; justify-content:center; font-size:15px;}
.iconbtn:hover{ background:var(--card-hover); }
#progressBarWrap{ position:fixed; top:var(--header-h); left:0; right:0; height:3px; background:transparent; z-index:59; }
#progressBar{ height:100%; width:0%; background:var(--primary); transition:width .15s; }

#body{ display:flex; flex:1; min-height:0; }

nav#sidebar{
  width:var(--sidebar-w); flex-shrink:0; background:var(--sidebar);
  border-right:1px solid var(--border); position:sticky; top:var(--header-h);
  height:calc(100vh - var(--header-h)); overflow-y:auto; padding:14px 0 40px;
}
nav#sidebar::-webkit-scrollbar{ width:8px; }
nav#sidebar::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
.nav-section{ margin-bottom:4px; }
.nav-section-title{
  font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
  padding:14px 18px 6px; font-weight:600;
}
.nav-item{
  display:flex; align-items:center; gap:8px; padding:7px 18px; font-size:13.5px; color:var(--text);
  border-left:2px solid transparent; cursor:pointer;
}
.nav-item:hover{ background:var(--card-hover); text-decoration:none; }
.nav-item.active{ border-left-color:var(--primary); background:var(--card-hover); color:var(--primary); font-weight:600; }
.nav-item .code{ font-family:var(--mono); font-size:10.5px; color:var(--muted); min-width:26px; }
.nav-item.active .code{ color:var(--primary); }
.nav-check{ margin-left:auto; font-size:12px; opacity:.8; }
.nav-toggle{ display:flex; align-items:center; justify-content:space-between; padding:10px 18px; cursor:pointer; font-size:12.5px; color:var(--muted); }
.nav-toggle:hover{ color:var(--text); }
.nav-collapsible{ overflow:hidden; }
.nav-collapsible.collapsed{ display:none; }

#sidebarBackdrop{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:55; }

main#content{ flex:1; min-width:0; padding:32px 28px 100px; }
.page{ max-width:var(--maxw); margin:0 auto; }
.page.wide{ max-width:1080px; }

/* ============================================================
   COMPONENTS
   ============================================================ */
.eyebrow{ font-size:12px; color:var(--primary); font-weight:600; margin-bottom:6px; }
.hero-title{ font-size:34px; margin:0 0 6px; }
.hero-sub{ color:var(--muted); font-size:16px; margin-bottom:28px; }

.card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; }
.card, .callout, .qz, td, th, .spec-ref, .chip{ overflow-wrap:anywhere; word-break:normal; }
.card + .card{ margin-top:14px; }
.grid{ display:grid; gap:14px; }
.grid.cols-4{ grid-template-columns:repeat(4,1fr); }
.grid.cols-3{ grid-template-columns:repeat(3,1fr); }
.grid.cols-2{ grid-template-columns:repeat(2,1fr); }
@media(max-width:900px){ .grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);} .grid.cols-2{grid-template-columns:1fr;} }

.stat-card{ text-align:left; }
.stat-num{ font-size:30px; font-weight:700; color:var(--primary); font-family:var(--mono); }
.stat-label{ color:var(--muted); font-size:13px; margin-top:2px; }

.chip{
  display:inline-flex; align-items:center; padding:4px 11px; border-radius:999px; font-size:12.5px;
  background:var(--card-hover); border:1px solid var(--border); color:var(--text); margin:0 6px 6px 0; cursor:pointer;
}
.chip:hover{ border-color:var(--primary); color:var(--primary); text-decoration:none; }

.badge{ display:inline-block; padding:2px 8px; border-radius:5px; font-size:11px; font-weight:600; letter-spacing:.02em; }
.badge.beginner{ background:rgba(52,211,153,.15); color:var(--secondary); }
.badge.intermediate{ background:rgba(96,165,250,.15); color:var(--primary); }
.badge.advanced{ background:rgba(248,113,113,.15); color:var(--danger); }

table{ width:100%; border-collapse:collapse; font-size:13.5px; }
th,td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--border-soft); vertical-align:top; }
th{ color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
tr:hover td{ background:var(--card-hover); }
.table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); }
.table-wrap table{ border:none; }
.table-wrap .table-wrap{ border:none; }

pre{
  background:var(--code); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:14px 16px; overflow-x:auto; font-size:13px; line-height:1.55; position:relative;
}
pre code{ color:#d1e8ff; }
.code-wrap{ position:relative; margin:10px 0; }
.code-lang{ position:absolute; top:8px; left:12px; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; z-index:2;}
.code-wrap pre{ padding-top:30px; }
.copy-btn{
  position:absolute; top:6px; right:8px; background:var(--card); border:1px solid var(--border);
  color:var(--muted); font-size:11px; padding:4px 9px; border-radius:5px; z-index:2;
}
.copy-btn:hover{ color:var(--text); border-color:var(--primary); }

.diagram-box{
  background:var(--code); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; overflow-x:auto;
}
.diagram-box pre{ background:none; border:none; padding:0; margin:0; color:#9fd7ff; font-size:12.8px; }
.diagram-image{
  display:block; width:100%; max-width:900px; height:auto; margin:0 auto;
}
.diagram-image-wrap{ overflow-x:auto; padding:10px; }
.beautiful-diagram{ padding:10px; }
.beautiful-diagram .diagram-image{ max-width:1120px; }
.generic-diagram{ max-width:none; min-width:620px; }
@media(max-width:700px){ .generic-diagram{ min-width:0; } }
.diagram-caption{ color:var(--muted); font-size:12px; margin-top:8px; text-align:center; }

.callout{ border-radius:var(--radius); padding:14px 16px; margin:12px 0; border-left:3px solid; font-size:14px; }
.callout .co-title{ font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; display:flex; gap:6px; align-items:center;}
.callout.info{ background:rgba(96,165,250,.08); border-color:var(--primary); }
.callout.info .co-title{ color:var(--primary); }
.callout.warning{ background:rgba(251,191,36,.08); border-color:var(--warning); }
.callout.warning .co-title{ color:var(--warning); }
.callout.important{ background:rgba(248,113,113,.08); border-color:var(--danger); }
.callout.important .co-title{ color:var(--danger); }
.callout.spec{ background:rgba(52,211,153,.08); border-color:var(--secondary); }
.callout.spec .co-title{ color:var(--secondary); }

.tag-doc{ color:var(--secondary); font-weight:700; }
.tag-know{ color:var(--primary); font-weight:700; }
.tag-inf{ color:var(--warning); font-weight:700; }
.tag-ex{ color:#c084fc; font-weight:700; }

.accordion{ border:1px solid var(--border); border-radius:var(--radius); margin:14px 0; overflow:hidden; }
.acc-head{
  display:flex; align-items:center; justify-content:space-between; padding:13px 18px; cursor:pointer;
  background:var(--card); font-weight:600; font-size:14.5px;
}
.acc-head:hover{ background:var(--card-hover); }
.acc-head .arrow{ transition:transform .15s; color:var(--muted); }
.accordion.open .acc-head .arrow{ transform:rotate(90deg); }
.acc-body{ display:none; padding:4px 18px 18px; background:var(--card); border-top:1px solid var(--border-soft); }
.accordion.open .acc-body{ display:block; }

.section-title{ font-size:20px; margin:28px 0 12px; padding-top:6px; }
.section-title:first-child{ margin-top:0; }

.spec-ref{ display:inline-block; font-family:var(--mono); font-size:12px; background:rgba(52,211,153,.12); color:var(--secondary); padding:2px 7px; border-radius:5px; margin:2px 4px 2px 0; cursor:help; }

.session-nav{ display:flex; justify-content:space-between; align-items:center; margin-top:40px; padding-top:20px; border-top:1px solid var(--border); gap:12px; }
.session-nav a{ font-size:13.5px; color:var(--text); border:1px solid var(--border); padding:9px 14px; border-radius:var(--radius-sm); }
.session-nav a:hover{ border-color:var(--primary); color:var(--primary); text-decoration:none; }
.session-nav .roadmap-link{ color:var(--muted); border:none; }

.progressbar-outer{ background:var(--border-soft); border-radius:999px; height:8px; overflow:hidden; }
.progressbar-inner{ background:linear-gradient(90deg,var(--primary),var(--secondary)); height:100%; transition:width .3s; }

.qz{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:10px; background:var(--card); }
.qz-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.qz-level{ font-size:10.5px; text-transform:uppercase; padding:2px 7px; border-radius:5px; flex-shrink:0; }
.qz-level.basic{ background:rgba(52,211,153,.15); color:var(--secondary); }
.qz-level.intermediate{ background:rgba(96,165,250,.15); color:var(--primary); }
.qz-level.advanced{ background:rgba(248,113,113,.15); color:var(--danger); }
.qz-toggle{ background:none; border:1px solid var(--border); color:var(--muted); font-size:11.5px; padding:3px 10px; border-radius:5px; margin-top:8px; }
.qz-toggle:hover{ color:var(--text); border-color:var(--primary); }
.qz-hint{ display:none; margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); font-size:13px; color:var(--muted); }
.qz.reviewed{ border-left:3px solid var(--secondary); }
.qz-mark{ font-size:11.5px; color:var(--muted); }
.qz-mark input{ margin-right:5px; }

.bookmark-btn{ background:none; border:1px solid var(--border); color:var(--muted); border-radius:var(--radius-sm); padding:6px 10px; font-size:12.5px; }
.bookmark-btn.active{ color:var(--warning); border-color:var(--warning); }

.linux-warn{ font-size:12px; color:var(--warning); margin-top:8px; font-style:italic; }

.roadmap-flow{ display:flex; flex-direction:column; align-items:stretch; gap:0; max-width:520px; margin:24px auto; }
.roadmap-node{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; text-align:center; font-weight:600; font-size:14px; }
.roadmap-node:hover{ border-color:var(--primary); color:var(--primary); cursor:pointer; text-decoration:none; display:block; }
.roadmap-arrow{ text-align:center; color:var(--muted); font-size:14px; padding:2px 0; }

.crossref-svg-wrap{ overflow-x:auto; }
.filter-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.filter-btn{ background:var(--card); border:1px solid var(--border); color:var(--muted); padding:6px 13px; border-radius:999px; font-size:12.5px; }
.filter-btn.active{ background:var(--primary); color:#0b1020; border-color:var(--primary); font-weight:600; }

#toTop{ position:fixed; bottom:24px; right:24px; width:42px; height:42px; border-radius:50%; background:var(--card); border:1px solid var(--border); color:var(--text); font-size:17px; display:none; align-items:center; justify-content:center; box-shadow:0 6px 20px rgba(0,0,0,.4); z-index:50; }
#toTop.show{ display:flex; }

.related-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
.difficulty-row{ display:flex; gap:16px; align-items:center; margin:10px 0 18px; flex-wrap:wrap; font-size:13px; color:var(--muted); }

::-webkit-scrollbar{ height:8px; width:8px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 900px){
  #menuBtn{ display:flex; align-items:center; justify-content:center; }
  nav#sidebar{
    position:fixed; left:0; top:0; height:100vh; z-index:70; transform:translateX(-100%);
    transition:transform .2s ease; padding-top:var(--header-h);
  }
  nav#sidebar.open{ transform:translateX(0); }
  #sidebarBackdrop.show{ display:block; }
  main#content{ padding:22px 16px 90px; }
  .grid.cols-4, .grid.cols-3{ grid-template-columns:1fr 1fr; }
  #searchWrap{ max-width:none; }
  #brand .full-sub{ display:none; }
  .hero-title{ font-size:26px; }
}
@media (max-width:520px){
  .grid.cols-4, .grid.cols-3, .grid.cols-2{ grid-template-columns:1fr; }
  .session-nav{ flex-direction:column; align-items:stretch; }
}

/* ============================================================
   BEAUTIFUL DIAGRAMS
   ============================================================ */
.beautiful-diagram{padding:10px;background:linear-gradient(180deg,var(--code),rgba(15,23,42,.92));overflow:hidden;}
.beautiful-diagram .diagram-image{display:block;width:100%;height:auto;min-height:260px;}
.beautiful-diagram:hover{border-color:var(--primary);}
@media(max-width:900px){
  .beautiful-diagram{overflow-x:auto;}
  .beautiful-diagram .diagram-image{min-width:860px;}
}
@media print{.beautiful-diagram{background:#fff!important;}}


/* ============================================================
   RUNTIME FLOW VISUALIZATION
   ============================================================ */
.runtime-visual{ margin:0; }
.runtime-visual svg{ display:block; width:100%; height:auto; }
.runtime-title{ font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:var(--text); }
.runtime-subtitle{ font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:var(--muted); }
.runtime-step-no{ font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:var(--text); }
.runtime-step-main{ font:650 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:var(--text); }
.runtime-step-small{ font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:var(--muted); }
.runtime-time{ font:700 11px var(--mono); fill:var(--primary); }
.runtime-line{ stroke:var(--border); stroke-width:3; }
.runtime-arrow{ stroke:var(--primary); stroke-width:3; fill:none; }
.runtime-node{ fill:var(--card); stroke:var(--border); stroke-width:2; }
.runtime-node.info{ stroke:var(--primary); }
.runtime-node.success{ stroke:var(--secondary); }
.runtime-node.warn{ stroke:var(--warning); }
.runtime-node.danger{ stroke:var(--danger); }
.runtime-node.special{ stroke:#c084fc; }
.runtime-dot.info{ fill:var(--primary); }
.runtime-dot.success{ fill:var(--secondary); }
.runtime-dot.warn{ fill:var(--warning); }
.runtime-dot.danger{ fill:var(--danger); }
.runtime-dot.special{ fill:#c084fc; }
.runtime-badge{ fill:var(--code); stroke:var(--border); stroke-width:1.5; }
.runtime-raw{ margin-top:10px; border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; }
.runtime-raw summary{ cursor:pointer; padding:8px 12px; background:var(--card-hover); color:var(--muted); font-size:12px; }
.runtime-raw pre{ margin:0; border:0; border-radius:0; background:var(--code); max-height:360px; overflow:auto; }

/* ============================================================
   PRINT MODE
   ============================================================ */
@media print{
  header#top, nav#sidebar, #sidebarBackdrop, #toTop, .bookmark-btn, .qz-toggle, .copy-btn, .session-nav, #progressBarWrap { display:none !important; }
  body{ background:#fff; color:#000; }
  .card, .accordion, pre, .diagram-box{ background:#fff; border-color:#ccc; color:#000; }
  .diagram-box pre{ color:#000; }
  pre code{ color:#000; }
  main#content{ padding:0; }
  .acc-body{ display:block !important; }
  a{ color:#000; text-decoration:underline; }
  .page{ max-width:100%; }
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button id="menuBtn" class="iconbtn" aria-label="Mở menu">☰</button>
    <div id="brand">
      <span>AUTOSAR OS</span><span class="ver">R25-11</span>
      <span class="full-sub muted" style="font-weight:400;font-size:12.5px;">Learning Knowledge Base</span>
    </div>
    <div id="searchWrap">
      <input id="searchInput" type="text" placeholder="Tìm session, API, object, spec reference…" aria-label="Tìm kiếm" autocomplete="off">
      <div id="searchResults"></div>
    </div>
    <div id="headerActions">
      <button id="themeToggle" class="iconbtn" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện">◐</button>
      <button id="printBtn" class="iconbtn" title="In / Export" aria-label="In">🖶</button>
    </div>
  </header>
  <div id="progressBarWrap"><div id="progressBar"></div></div>

  <div id="body">
    <div id="sidebarBackdrop"></div>
    <nav id="sidebar" aria-label="Điều hướng chính"></nav>
    <main id="content"><div class="page" id="pageRoot"></div></main>
  </div>
</div>

<button id="toTop" title="Lên đầu trang" aria-label="Lên đầu trang">↑</button>

<script>
const SESSIONS = [
  {
    "id": 1,
    "code": "S01",
    "title": "AUTOSAR ZERO",
    "subtitle": "Định vị AUTOSAR OS trong bức tranh toàn cảnh",
    "difficulty": "Beginner",
    "prereq": [],
    "related": [
      2,
      3
    ],
    "concepts": [
      "AUTOSAR",
      "Classic Platform",
      "Adaptive Platform",
      "BSW",
      "RTE",
      "SWC",
      "OSAL",

    "explanation": "[DOCUMENT] Nhắc lại nền tảng (Chapter 7.1.1) — Core OS kế thừa từ OSEK đúng 2 cặp giao diện lifecycle: 'a startup interface through StartOS and the StartupHook' và 'a shutdown interface through ShutdownOS and the ShutdownHook'.\n\n[DOCUMENT] Điều quan trọng và dễ bị bỏ sót: AUTOSAR OS không định nghĩa một hàm khởi tạo riêng kiểu Os_Init(). Đã kiểm tra toàn văn 410 trang — không có bất kỳ định nghĩa nào cho Os_Init. Duy nhất một gợi ý gián tiếp nằm ở mô tả isOsStarted (Chapter 8.4.37): '...assumes a valid and initialized C environment (e.g. main() was called before the use of isOsStarted)'. Trình tự khởi động thực tế là: CPU reset → startup code (C runtime init, do compiler/linker cung cấp, không phải OS) → main() → StartOS(). StartOS() chính là 'hàm khởi tạo' của OS — không có bước Os_Init() tách biệt như ta quen thấy ở các BSW module khác (Com_Init, Dem_Init...).\n\n[DOCUMENT] Hai ràng buộc 'Undefined Behaviour' cực kỳ quan trọng: [SWS_Os_00424]: 'The first call to StartOS (for starting the Operating System) shall not return.' [SWS_Os_00425]: 'If ShutdownOS is called and ShutdownHook returns then the Operating System module shall disable all interrupts and enter an endless loop.' Hai điểm neo của toàn bộ vòng đời: StartOS = điểm không quay lại, ShutdownOS = điểm kết thúc bằng vòng lặp vô hạn (không phải reset CPU tự động — đó là việc của phần cứng/watchdog bên ngoài OS).\n\n[DOCUMENT] Có 3 nhóm Hook, mỗi nhóm lại chia system-specific (toàn hệ thống, do integrator cung cấp) và application-specific (`_<App>` suffix, thuộc 1 OS-Application). Chữ ký: system: StartupHook(void), ErrorHook(StatusType Error), ShutdownHook(StatusType Fatalerror), ProtectionHook(StatusType Fatalerror)->ProtectionReturnType. Application-specific có hậu tố theo tên App, ví dụ StartupHook_BodyControl(void).\n\n[DOCUMENT] Chapter 7.12.1 giải thích trực tiếp vì sao có cả 2 loại hook: 'Hook routines as defined in OSEK OS run at the level of the Operating System module and therefore can only belong to the trusted environment... these hook routines are global to the system (system-specific) and will probably be supplied by the ECU integrator. In AUTOSAR however, each OS-Application may have the need to execute application specific code e.g. initialize some hardware in its own additional (application-specific) startup hook.' => Đây lại chính là hệ quả của vấn đề isolation cho multi-source SWC (Session 2): OSEK gốc chỉ có 1 hook toàn cục do integrator viết — nhưng khi nhiều nhà cung cấp cùng đóng góp OS-Application vào 1 ECU, mỗi App cần 'không gian riêng' để tự khởi tạo/tự xử lý lỗi/tự dọn dẹp.\n\n[DOCUMENT] Thứ tự Hook (Chapter 7.12): Startup — system TRƯỚC app-specific [SWS_Os_00236]; Shutdown — app-specific TRƯỚC system [SWS_Os_00237]; Error — system TRƯỚC app-specific [SWS_Os_00246]. Thứ tự GIỮA các App: 'not defined'. Mỗi app-specific hook chạy 'with the access rights of the associated OS-Application' [00226/00225/00085].\n\n[INFERENCE] Chú ý điểm bất đối xứng thú vị: Startup đi từ ngoài vào trong (system → app), còn Shutdown đi từ trong ra ngoài (app → system) — giống mô hình 'constructor/destructor' cổ điển trong lập trình hướng đối tượng (khởi tạo lớp cha trước, hủy lớp con trước).\n\n[DOCUMENT] [SWS_Os_00299]: DisableAllInterrupts/EnableAllInterrupts/SuspendAllInterrupts/ResumeAllInterrupts phải khả dụng TRƯỚC StartOS và SAU ShutdownOS.\n\n[DOCUMENT] Quy tắc quan trọng ràng buộc khi nào ErrorHook được gọi — [SWS_Os_00367]: 'Operating System module's services which do not return a StatusType - except ActivateTaskAsyn and SetEventAsyn - shall not raise the error hook(s).' => ActivateTaskAsyn/SetEventAsyn không trả StatusType nhưng là 2 ngoại lệ được phép báo lỗi qua ErrorHook.\n\n[DOCUMENT] ProtectionHook trả về 1 trong 5 giá trị (ProtectionReturnType, chi tiết đầy đủ ở Session 20).\n\n[DOCUMENT] Availability theo Scalability Class (xem trước Session 24): ProtectionHook — [SWS_Os_00542]: 'Available in Scalability Classes 2, 3 and 4'. rementCounter trên HARDWARE Counter → E_OS_ID.\n\n[DOCUMENT] Về GetElapsedValue — [SWS_Os_00382]: \"...shall return the number of elapsed ticks since the given <Value> value via <ElapsedValue> and shall return E_OK.\" Value CŨNG được cập nhật thành giá trị hiện tại.\n\n[DOCUMENT] [SWS_Os_00384]: \"adjust the read out values of hardware timers... lowest value is zero and consecutive reads return an increasing count value until the timer wraps at its modulus\" => giá trị Hardware Counter được 'adjust' — bắt đầu 0, tăng dần tới khi wrap tại modulus (không phải giá trị thanh ghi thô).",

on between alarms can be guaranteed. This typically means modifying the alarms while associated Counter tick interrupts are disabled.\" [INFERENCE] Vấn đề cốt lõi — nếu bạn có 5 Alarm riêng biệt mô phỏng 'một chuỗi hành động theo thời gian', và muốn thay đổi cả chuỗi cùng lúc lúc runtime (ví dụ chuyển sang một 'kịch bản' khác), bạn phải tắt interrupt để tránh 5 Alarm bị 'lệch pha' nhau giữa chừng khi sửa — cực kỳ rủi ro. ScheduleTable đóng gói toàn bộ chuỗi expiry point thành MỘT đơn vị nguyên tử.\n\n[DOCUMENT] Lý do cần Synchronization (Chapter 7.4.1) — vì sao chỉ 'lặp lại' thôi chưa đủ: \"if the ScheduleTable repeats then it is not guaranteed that the absolute count value at which the initial expiry point was first processed is the same count value at which it is subsequently processed. This is because the duration of the ScheduleTable need not be equal to the Counter modulus.\" Use-case cụ thể được nêu: 'Synchronization of expiry points to degrees of angular rotation for motor management', 'Synchronizing the computation to a global (network) time base'.\n\n[DOCUMENT] Vì sao AUTOSAR OS không tự cung cấp global time: \"1. a global time may not be needed in many cases; 2. other AUTOSAR modules, most notably FlexRay, provide this independently to the Operating System; 3. if the Operating System is required to synchronize to multiple global (network) time sources... the Operating System cannot be the source of a unique global time.\"\n\n[DOCUMENT] Thứ tự xử lý trong 1 Expiry Point — quy tắc chống non-determinism cực kỳ quan trọng: [SWS_Os_00412]: \"If an expiry point contains actions to activate a Task and to set one or several Event(s) of the same Task, then the Operating System module shall process this Task activation before the related Event(s) are set.\" Lý do tồn tại quy tắc này: nếu thứ tự bị đảo ngược, SetEvent trên 1 Task đang SUSPENDED (chưa activate) sẽ THẤT BẠI, trong khi activate trước rồi mới set event thì LUÔN thành công.\n\n[DOCUMENT] Start tương đối v     "explanation": "[DOCUMENT] Container OsIsr (Chapter 10.2.17): [ECUC_Os_00041]: \"The OsIsr container represents an ISO 17356 interrupt service routine.\" OsIsrCategory: CATEGORY_1/CATEGORY_2. OsIsrPeriod: 'period in seconds... Be aware, that this parameter is not supposed to be relevant for the OS! It's the responsibility of the integrator...' — chỉ mang tính thông tin cho RTE, OS hoàn toàn không dùng giá trị này. OsIsrResourceRef — 'the resources accessed by this ISR'. OsIsrTimingProtection (0..1) — 'If the container exists, timing protection is used... If the container does not exist, the interrupt is not supervised regarding timing violations.'\n\n[DOCUMENT] ISRType (Chapter 8.3.11): 'identifies an interrupt service routine (ISR)', có giá trị đặc biệt INVALID_ISR.\n\n[DOCUMENT] Định nghĩa nền tảng (Chapter 7.7 Protection Facilities): \"Protection is only possible for Operating System managed objects. This means that: It is not possible to provide protection during runtime of Category 1 ISRs, because the operating system is not aware of any Category 1 ISRs being invoked.\" => Category 1 = ISR mà OS hoàn toàn 'không biết' nó tồn tại lúc runtime (không có entry/exit hook, không nằm trong bất kỳ state machine nào của OS). Category 2 = ISR mà OS 'nhìn thấy' đầy đủ — có state machine riêng, được trace bởi ARTI, được bảo vệ bởi Timing Protection.\n\n[DOCUMENT] Hệ quả trực tiếp của việc Cat1 'vô hình': \"Therefore, if any protection is required, Category 1 ISRs have to be avoided. If Category 1 interrupts AND OS-Applications are used together then all Category 1 ISR must belong to a trusted OS-Application.\" (Timing Protection, preview Session 17): \"Timing protection only applies to Tasks or Category 2 ISRs. There is no protection for Category 1 ISRs. If timing protection error occurs during a category 1 ISR, consistency of the Operating System module cannot be guaranteed. Therefore we discourage timing protection in systems with category 1 interrupts.\"\n\n[KNOWLED     "explanation": "[DOCUMENT] Đây là 'WHY' hay nhất của cả tài liệu — AUTOSAR cố tình từ chối cách làm trực quan nhất: \"AUTOSAR OS does not offer deadline monitoring for timing protection. Deadline monitoring is insufficient to correctly identify the Task/ISR causing a timing fault... The Task/ISR that misses a deadline is therefore not necessarily the Task/ISR that has failed at runtime, it is simply the earliest point that a timing fault is detected.\"\n\n[DOCUMENT] Ví dụ minh chứng, trích nguyên bảng cấu hình: TaskID A (High priority, Execution Time=1, Deadline/Period=5); B (Medium, 3, 10); C (Low, 5, 15). \"Now consider the case when Tasks A and B behave incorrectly... Both Tasks A and B meet their deadlines. Task C however, behaves correctly but it fails to meet its deadline because of the incorrect execution of Tasks A and B. This is fault propagation — a fault in an unrelated part of the system is causing a correctly functioning part of the system to fail.\" [INFERENCE] Nếu OS chỉ giám sát 'ai trễ deadline', nó sẽ giết nhầm Task C (nạn nhân vô tội) trong khi A và B (thủ phạm thật) vẫn 'kỹ thuật đúng hẹn'. Đây là lý do AUTOSAR chọn giám sát trực tiếp 3 nguyên nhân gốc rễ của từng Task/ISR riêng lẻ.\n\n[DOCUMENT] 3 trụ cột Timing Protection (Chapter 7.7.2.1): \"Whether a Task or ISR meets its deadline... is determined by: (1) the execution time of Task/ISRs, (2) the blocking time that Task/ISRs suffers from lower priority Tasks/ISRs locking shared resources or disabling interrupts, (3) the interarrival rate of Task/ISRs.\" (1) Execution Time → Execution Budget → ProtectionHook(E_OS_PROTECTION_TIME). (2) Blocking Time → Lock Budget (Resource + Interrupt disable) → ProtectionHook(E_OS_PROTECTION_LOCKED). (3) Interarrival Rate → Time Frame → ProtectionHook(E_OS_PROTECTION_ARRIVAL).\n\n[DOCUMENT] Vì sao có Deferrable Server (giải pháp thay thế 'giết chết'): \"Unfortunately the reaction is often limited to a killing of the faulty entity... Instead of calling the ProtectionHook and applying one of the current destructive reactions... the new reaction consists in quietly descheduling the task and placing it in a state where it cannot be scheduled until its budget is replenished again. This approach is also known as 'Deferrable Server', an effective and easy-to-implement variant of a real-time scheduling mechanism known as 'Aperiodic Server'.\"\n\n[DOCUMENT] Chỉ dành cho Task có OsTaskTimingProtectionDeferrableServer=TRUE: [SWS_Os_00869]: \"The AUTOSAR OS shall support an additional task state BUDGET_EXHAUSTED for Tasks configured with OsTaskTimingProtectionDeferrableServer=TRUE... In this state a Task is not running and cannot be scheduled.\" => Trạng thái thứ 5 của Task, ngoài 4 trạng thái đã học ở Session 6.\n\n[DOCUMENT] Hành vi đặc biệt trong lúc BUDGET_EXHAUSTED — không hề 'chặn' các thao tác bên ngoài: [SWS_Os_00870]: \"Any functionality (API or alarm action or expiry point) which tries to activate the Task (or set an Event) in state BUDGET_EXHAUSTED shall behave as if the Task would be in state READY... Example: If a user calls SetEvent for a Task which is currently in BUDGET_EXHAUSTED, the function shall set the events and return E_OK.\" [INFERENCE] BUDGET_EXHAUSTED không phải 'Task biến mất' — nó vẫn nhận được SetEvent/ActivateTask bình thường, chỉ là chưa được lập lịch chạy cho tới khi có ngân sách trở lại.\n\n[DOCUMENT] Ghi chú tinh vi về ngân sách âm: \"[SWS_Os_00871] effectively mean that the Task's current budget can be lower than zero. This can e.g. happen when the budget is exhausted but a switch to the BUDGET_EXHAUSTED state is delayed because the Task still holds an OS resource.\" [INFERENCE] Nếu Task cạn ngân sách trong lúc đang giữ Resource, OS không ép nó dừng ngay (tránh vi phạm nguyên tắc Priority Ceiling/LIFO) — nó tiếp tục chạy tới khi giải phóng xong Resource, ngân sách lúc đó có thể đã âm.\n\n[DOCUMENT] Kịch bản mặc định (không Deferrable Server): [SWS_Os_00064]: \"If a Task's OsTaskExecutionBudget is reached and OsTaskTimingProtectionDeferrableServer is not configured (as per default), then the Operating System module shall call the ProtectionHook with E_OS_PROTECTION_TIME.\" [SWS_Os_00473]: reset budget khi transition về SUSPENDED/WAITING (nếu không Deferrable Server).\n\n[DOCUMENT] Kịch bản Arrival Rate: [SWS_Os_00466]/[00467]: \"If an attempt is made to activate/release a Task before the end of an OsTaskTimeFrame then... shall not perform the activation/release AND shall call the ProtectionHook with E_OS_PROTECTION_ARRIVAL.\" [INFERENCE] Kết nối trực tiếp Session 8: nhớ lại quy tắc 'Waiting for an Event which is already set represents a new arrival' — nếu điều này xảy ra quá nhanh liên tiếp, chính nó có thể kích hoạt E_OS_PROTECTION_ARRIVAL!\n\n[DOCUMENT] BudgetReplenish (đã giới thiệu sơ ở Session 4/10, nay đầy đủ): \"StatusType BudgetReplenish(TaskType id)\" — [SWS_Os_00874]: 'will add the configured execution budget... to the current budget. If this would result in a bigger current budget than configured, the budget is saturated.' Note: 'it is not allowed to do a self replenish by calling the API with the own Task Id.' [SWS_Os_00875]: chỉ SC2,4. [INFERENCE] Quy tắc 'không tự replenish chính mình' hoàn toàn hợp lý về mặt logic — một Task đang BUDGET_EXHAUSTED không thể chạy để gọi bất kỳ API nào, kể cả BudgetReplenish cho chính nó — do đó cấm luôn ở mức API là một lớp bảo vệ logic bổ sung.\n\n[DOCUMENT] 3 cách nạp lại ngân sách: BudgetReplenish() (API, do Task/ISR khác gọi); Alarm với action OsAlarmBudgetReplenish (Session 10); ScheduleTable expiry point với OsScheduleTableTaskReplenish (Session 11).",

    "explanation": "[DOCUMENT] Định nghĩa và đúng 5 kịch bản (Chapter 7.7.3.1): \"As OS-Applications can interact with the Operating System module through services, it is essential that the service calls will not corrupt the Operating System module itself. Service Protection guards against such corruption at runtime. There are a number of cases to consider... An OS-Application makes an API call: 1. with an invalid handle or out of range value. 2. in the wrong context, e.g. calling ActivateTask in the StartupHook. 3. or fails to make an API call that results in the OSEK OS being left in an undefined state, e.g. it terminates without a ReleaseResource call 4. that impacts on the behaviour of every other OS-Application in the system, e.g. ShutdownOS 5. to manipulate Operating System objects that belong to another OS-Application (to which it does not have the necessary permissions), e.g. an OS-Application tries to execute ActivateTask on a Task it does not own.\"\n\n[DOCUMENT] Nền tảng quan trọng — Service Protection thừa hưởng cơ chế lỗi có sẵn của OSEK, nhưng chỉ hoạt động ở Extended status: \"The OSEK OS already provides some service protection through the status codes returned from service calls... This means that service protection will only apply for the extended status of OSEK OS.\" [INFERENCE] Đây chính là lý do hầu như mọi mã lỗi xuyên suốt tài liệu đều ghi chú '(only in EXTENDED status)' — và đây cũng là lý do OsStatus (Session 14) là công tắc tối quan trọng: nếu hệ thống cấu hình OsStatus=STANDARD, phần lớn Service Protection không hoạt động.\n\n[DOCUMENT] Kịch bản 4 (ảnh hưởng toàn hệ thống) — nguyên tắc chung: \"In a protected system, additional constraints need to be placed to prevent non-trusted OS-Applications executing API calls that can have a global effect on the system. Each level of restriction is a proper subset of the previous level.\" [INFERENCE] 'Proper subset' nghĩa là Non-trusted ⊂ Trusted về mặt tập hợp API được phép gọi — mọi API Non-trusted ting System shall not schedule any other Tasks which belong to the same OS-Application as the non-trusted caller of the service. Also interrupts of Category 2 which belong to the same OS-Application shall be disabled during the execution of the service.\" [INFERENCE] Khóa này áp dụng cho Task/ISR khác của App GỌI (non-trusted) — KHÔNG PHẢI của App trusted cung cấp hàm! Mục đích: ngăn tình huống (B).\n\n[DOCUMENT] Đánh đổi khi bật OsLockTrustedFunctionCall=TRUE: \"The disadvantage of this approach is that it impacts the overall timing (i.e. also of other OS-Applications which use the same core).\" [INFERENCE] Vì khóa scheduling toàn core trong lúc gọi (không chỉ App gọi), nó ảnh hưởng cả App khác không liên quan đang chờ CPU trên cùng core — một đánh đổi kinh điển giữa an toàn và hiệu năng thời gian thực.\n\n[DOCUMENT] [SWS_Os_00100]: \"If CallTrustedFunction is called and the called trusted function is not configured the Operating System module shall call the ErrorHook with E_OS_SERVICEID.\" [SWS_Os_00451]: \"The Operating System module shall allow exporting services from trusted OS-Applications.\"",

 source: [SWS_Os_00109]: \"If forcibly terminates an interrupt service routine, it clears the interrupt request, aborts the ISR (the interrupt source stays in the current state)...\" [SWS_Os_00110]: \"If forcibly terminate an OS-Application, it shall: ...disable interrupt sources of Category 2 ISRs belonging to the OS-Application\" [INFERENCE] Giết 1 ISR đơn lẻ = 'lần này thôi' — interrupt source VẪN BẬT, lần ngắt kế tiếp vẫn được xử lý bình thường. Giết cả App = 'vĩnh viễn' — interrupt source bị TẮT hẳn, không còn ngắt nào tới nữa từ nguồn đó.\n\n[DOCUMENT] Phát hiện thêm — [SWS_Os_00475]: \"If the ProtectionHook returns PRO_IGNORE and the ProtectionHook was not called with E_OS_PROTECTION_ARRIVAL then the Operating System module shall call ShutdownOS.\" => PRO_IGNORE chỉ thực sự 'an toàn' khi lỗi là ARRIVAL — dùng IGNORE cho bất kỳ lỗi nào khác (vd Memory) sẽ bị coi là giá trị không hợp lệ, dẫn tới Shutdown!\n\n[DOCUMENT] [SWS_Os_00860]: lỗi EXCEPTION/MEMORY từ trusted function → chỉ SHUTDOWN hợp lệ, giá trị khác cũng dẫn tới shutdown.",

<script>
/* ============================================================
   AUTOSAR OS R25-11 Knowledge Base — Application Engine
   Vanilla JS, no external dependencies, offline-first.
   ============================================================ */
(function(){
"use strict";

/* ---------- Utilities ---------- */
function esc(s){
  if(s===undefined||s===null) return "";
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); }
function byId(id){ return SESSIONS.find(function(s){ return s.id===id; }); }
function codeFor(id){ var s=byId(id); return s? s.code : ("S"+id); }
function titleFor(id){ var s=byId(id); return s? s.title : ("Session "+id); }

/* ---------- LocalStorage-backed state ---------- */
var LS_KEY = "autosar_kb_v1";
function loadState(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { progress:{}, bookmarks:[], reviewed:{}, theme:null };
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(e){}
}
var STATE = loadState();
if(!STATE.progress) STATE.progress = {};
if(!STATE.bookmarks) STATE.bookmarks = [];
if(!STATE.reviewed) STATE.reviewed = {};

function getProgress(id){ return STATE.progress[id] || "none"; } // none | progress | done
function cycleProgress(id){
  var cur = getProgress(id);
  var next = cur==="none" ? "progress" : (cur==="progress" ? "done" : "none");
  STATE.progress[id] = next;
  saveState();
  return next;
}
function completedCount(){
  var n=0; for(var k in STATE.progress){ if(STATE.progress[k]==="done") n++; }
  return n;
}
function isBookmarked(type,id){
  return STATE.bookmarks.some(function(b){ return b.type===type && b.id===id; });
}
function toggleBookmark(type,id,label){
  var idx = STATE.bookmarks.findIndex(function(b){ return b.type===type && b.id===id; });
  if(idx>=0) STATE.bookmarks.splice(idx,1);
  else STATE.bookmarks.push({type:type,id:id,label:label});
  saveState();
  renderSidebar();
}
function isReviewed(sessionId, qIdx){
  return !!(STATE.reviewed[sessionId] && STATE.reviewed[sessionId][qIdx]);
}
function toggleReviewed(sessionId,qIdx){
  if(!STATE.reviewed[sessionId]) STATE.reviewed[sessionId]={};
  STATE.reviewed[sessionId][qIdx] = !STATE.reviewed[sessionId][qIdx];
  saveState();
}
function reviewedCountFor(sessionId){
  var s=byId(sessionId); if(!s) return {done:0,total:0};
  var total = s.quiz.length;
  var done=0; var map = STATE.reviewed[sessionId]||{};
  for(var k in map){ if(map[k]) done++; }
  return {done:done, total:total};
}

/* ---------- Theme ---------- */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  STATE.theme = t; saveState();
  var btn = document.getElementById("themeToggle");
  if(btn) btn.textContent = t==="dark" ? "◐" : "◑";
}
(function initTheme(){
  var t = STATE.theme || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  applyTheme(t);
})();

/* ---------- Router ---------- */
var ROUTES = {}; // path -> render function
function route(path){ ROUTES[path]=arguments[1]; }
function navigate(hash){
  if(location.hash === hash){ onHashChange(); }
  else location.hash = hash;
}
window.addEventListener("hashchange", onHashChange);

function currentHash(){ return location.hash.replace(/^#/,"") || "dashboard"; }

function onHashChange(){
  var h = currentHash();
  var root = document.getElementById("pageRoot");
  var parts = h.split("/");
  var key = parts[0];
  var arg = parts[1];
  var fn = ROUTES[key] || ROUTES["dashboard"];
  root.innerHTML = fn(arg);
  root.parentElement.scrollTop = 0;
  window.scrollTo(0,0);
  highlightSidebar(h);
  wireDynamicContent();
  closeMobileSidebar();
}

/* ============================================================
   SIDEBAR
   ============================================================ */
function renderSidebar(){
  var nav = document.getElementById("sidebar");
  var pct = Math.round(100*completedCount()/SESSIONS.length);
  var html = "";
  html += '<div class="nav-section">';
  html += navItem("dashboard","⌂","Dashboard");
  html += navItem("roadmap","→","Learning Roadmap");
  html += '</div>';

  html += '<div class="nav-section-title">37 Sessions <span class="muted" style="font-weight:400;">('+completedCount()+'/'+SESSIONS.length+')</span></div>';
  html += '<div style="padding:0 18px 10px;"><div class="progressbar-outer"><div class="progressbar-inner" style="width:'+pct+'%"></div></div></div>';
  SESSIONS.forEach(function(s){
    var p = getProgress(s.id);
    var mark = p==="done" ? "✓" : (p==="progress" ? "◐" : "☐");
    html += '<a class="nav-item" data-hash="session/'+s.id+'" href="#session/'+s.id+'"><span class="code">'+s.code+'</span><span>'+esc(s.title)+'</span><span class="nav-check">'+mark+'</span></a>';
  });

  html += '<div class="nav-section-title">Reference</div>';
  html += navItem("api-index","{ }","API Master Index");
  html += navItem("object-index","▣","OS Object Index");
  html += navItem("config-index","⚙","Configuration Index");
  html += navItem("crossref","◈","Cross-Reference Map");
  html += navItem("glossary","Aa","Glossary");
  html += navItem("cheatsheet","⚡","Quick Reference");

  html += '<div class="nav-section-title">Practice</div>';
  html += navItem("runtime-lab","▶","Runtime Lab");
  html += navItem("mini-project","🛠","Mini Project");
  html += navItem("final-assessment","🏁","Final Assessment");

  html += '<div class="nav-section-title">★ Bookmarks <span class="muted" style="font-weight:400;">('+STATE.bookmarks.length+')</span></div>';

  highlightSidebar(currentHash());
}

}
function highlightSidebar(hash){

function openMobileSidebar(){ document.getElementById("sidebar").classList.add("open"); document.getElementById("sidebarBackdrop").classList.add("show"); }

/* ============================================================
   CONTENT RENDER HELPERS

function parseTaggedText(text){
  if(!text) return "";
  var paras = text.split(/\n\n+/);
  return paras.map(function(p){
    var html = esc(p).replace(/\n/g,"<br>");
    html = html.replace(/\[DOCUMENT\]/g,'<span class="tag-doc">[DOCUMENT]</span>');
    html = html.replace(/\[KNOWLEDGE\]/g,'<span class="tag-know">[KNOWLEDGE]</span>');
    html = html.replace(/\[INFERENCE\]/g,'<span class="tag-inf">[INFERENCE]</span>');
    html = html.replace(/\[EXAMPLE\]/g,'<span class="tag-ex">[EXAMPLE]</span>');
    return "<p>"+html+"</p>";
  }).join("");
}
function diagEsc(v){
  return esc(String(v==null?'':v));
}
function diagWrap(text, maxChars){
  var out=[]; String(text||'').split(/\s+/).forEach(function(word){
    var current=out.length ? out[out.length-1] : '';
    if(!current){ out.push(word); return; }
    if((current+' '+word).length<=maxChars) out[out.length-1]=current+' '+word;
    else out.push(word);
  });
  return out;
}
function diagText(x,y,lines,opts){
  opts=opts||{}; var fs=opts.fs||14, fill=opts.fill||'var(--text)', anchor=opts.anchor||'middle', weight=opts.weight||500, lh=opts.lh||18;

}
function diagTitle(t,sub,w){
  var out='<text x="'+(w/2)+'" y="34" text-anchor="middle" font-family="var(--sans)" font-size="20" font-weight="750" fill="var(--text)">'+diagEsc(t)+'</text>';
  if(sub) out += '<text x="'+(w/2)+'" y="56" text-anchor="middle" font-family="var(--sans)" font-size="11.5" fill="var(--muted)">'+diagEsc(sub)+'</text>';

function diagNode(x,y,w,h,title,sub,kind,opts){

function runtimeWrap(text, maxChars){
  var words = String(text || '').split(/\s+/).filter(Boolean);
  var lines=[], line='';
  maxChars = maxChars || 52;
  words.forEach(function(w){
    var test=line ? line+' '+w : w;
    if(test.length > maxChars && line){ lines.push(line); line=w; }
    else line=test;
  });
  if(line) lines.push(line);
  return lines.length ? lines : [''];
}

function runtimeKind(text){
  var s=String(text||'').toLowerCase();
  if(/e_os_|pro_|error|vi phạm|bị|không được|không được thực|không preempt|không phát hiện|no_access|lỗi/.test(s)) return 'danger';
  if(/budget|wait|waiting|ready|preempt|state|terminate|suspended|running|release|activate|schedule|scheduler|counter|alarm|event/.test(s)) return 'info';
  if(/trusted|mpu|protection|memory|spinlock|core|ioc|flash/.test(s)) return 'special';
  if(/e_ok|được phép|success|hoàn tất|chạy|resume|continue|startos/.test(s)) return 'success';
  if(/warning|cảnh báo/.test(s)) return 'warn';
  return 'info';
}

function runtimeStageLabel(text){
  var s=String(text||'');
  if(/^t\s*=/.test(s)) return s.split(/\s+/).slice(0,2).join(' ');
  if(/StartOS|Reset/i.test(s)) return 'BOOT';
  if(/Scheduler/i.test(s)) return 'SCHEDULER';
  if(/ISR/i.test(s)) return 'ISR';
  if(/Alarm|Counter|ScheduleTable/i.test(s)) return 'TIMER';
  if(/Protection|MPU|E_OS_PROTECTION/i.test(s)) return 'PROTECTION';
  if(/TrustedFunction|TRUSTED/i.test(s)) return 'TRUSTED';
  if(/Spinlock|Core/i.test(s)) return 'MULTICORE';
  if(/IOC|Rte_Call/i.test(s)) return 'IOC / RTE';
  if(/Resource|Priority Ceiling/i.test(s)) return 'RESOURCE';
  return 'RUNTIME';
}

function runtimeSteps(text){
  var raw=String(text||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim();
  if(!raw) return [];
  if(/^N\/A\b/i.test(raw)) return [{text:raw,kind:'warn',label:'NO RUNTIME'}];
  var out=[];
  raw.split(/\n+/).forEach(function(line){
    line=line.trim();
    if(!line) return;
    var pieces=line.split(/\s+->\s+/);
    if(pieces.length===1){ out.push({text:line,kind:runtimeKind(line),label:runtimeStageLabel(line)}); return; }
    pieces.forEach(function(piece){
      var v=piece.trim();
      if(v) out.push({text:v,kind:runtimeKind(v),label:runtimeStageLabel(v)});
    });
  });
  return out;
}

function runtimeBox(text,id){
  if(!text) return '';
  var steps=runtimeSteps(text);
  if(!steps.length) return '';
  if(steps.length===1 && /^N\/A\b/i.test(text)){
    return '<div class="runtime-visual"><svg class="diagram-image" viewBox="0 0 1040 250" role="img" aria-label="Runtime behavior not applicable">'
      +'<text x="520" y="42" text-anchor="middle" class="runtime-title">Runtime Behavior</text>'
      +'<rect x="120" y="78" width="800" height="100" rx="16" class="runtime-node warn"/>'
      +'<circle cx="170" cy="128" r="20" class="runtime-dot warn"/>'
      +'<text x="170" y="133" text-anchor="middle" class="runtime-step-no">—</text>'
      +'<text x="210" y="119" class="runtime-step-main">No runtime behavior riêng</text>'
      +'<text x="210" y="146" class="runtime-step-small">'+esc(text.replace(/^N\/A\s*[—-]?\s*/i,''))+'</text>'
      +'</svg></div>';
  }

  var width=1120, left=120, nodeX=150, nodeW=880, top=74, gap=22, nodeH=94;
  var h=top + steps.length*(nodeH+gap) + 44;
  var title='Runtime Flow';
  var subtitle='Session '+String(id).padStart(2,'0')+' · CPU / OS execution trace';
  var html='<div class="runtime-visual"><svg class="diagram-image" viewBox="0 0 '+width+' '+h+'" role="img" aria-label="Runtime flow diagram">';
  html+='<defs>'
      +'<marker id="runtimeArrow_'+id+'" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3.5 L0,7 Z" fill="var(--primary)"/></marker>'
      +'</defs>';
  html+='<text x="560" y="28" text-anchor="middle" class="runtime-title">'+esc(title)+'</text>';
  html+='<text x="560" y="51" text-anchor="middle" class="runtime-subtitle">'+esc(subtitle)+'</text>';
  html+='<line x1="82" y1="'+(top+18)+'" x2="82" y2="'+(top+(steps.length-1)*(nodeH+gap)+nodeH-18)+'" class="runtime-line"/>';

  steps.forEach(function(step,i){
    var y=top+i*(nodeH+gap);
    var lines=runtimeWrap(step.text, 66);
    if(lines.length>3){
      lines=lines.slice(0,3);
      lines[2]=lines[2].slice(0,60)+'…';
    }
    html+='<circle cx="82" cy="'+(y+nodeH/2)+'" r="9" class="runtime-dot '+step.kind+'"/>';
    if(i<steps.length-1){
      html+='<line x1="82" y1="'+(y+nodeH/2+10)+'" x2="82" y2="'+(y+nodeH+gap+nodeH/2-10)+'" class="runtime-arrow" marker-end="url(#runtimeArrow_'+id+')"/>';
    }
    html+='<rect x="'+nodeX+'" y="'+y+'" width="'+nodeW+'" height="'+nodeH+'" rx="16" class="runtime-node '+step.kind+'"/>';
    html+='<rect x="'+(nodeX+18)+'" y="'+(y+16)+'" width="125" height="24" rx="12" class="runtime-badge"/>';
    html+='<text x="'+(nodeX+80)+'" y="'+(y+33)+'" text-anchor="middle" class="runtime-time">'+esc(step.label)+'</text>';
    lines.forEach(function(line,j){
      html+='<text x="'+(nodeX+165)+'" y="'+(y+31+j*21)+'" class="runtime-step-main">'+esc(line)+'</text>';
    });
    html+='<text x="'+(nodeX+nodeW-18)+'" y="'+(y+28)+'" text-anchor="end" class="runtime-step-small">STEP '+String(i+1).padStart(2,'0')+'</text>';
  });
  html+='</svg>';
  html+='<details class="runtime-raw"><summary>Xem runtime trace gốc</summary><pre><code>'+esc(text)+'</code></pre></details>';
  html+='</div>';
  return html;
}

/* ============================================================
   SEARCH ENGINE
   ============================================================ */
var SEARCH_INDEX = [];
(function buildSearchIndex(){
  SESSIONS.forEach(function(s){
    SEARCH_INDEX.push({type:"Session", label:s.code+" · "+s.title, hash:"session/"+s.id, text:(s.title+" "+s.subtitle+" "+s.concepts.join(" ")).toLowerCase()});
    (s.api||[]).forEach(function(a){
      SEARCH_INDEX.push({type:"API", label:a.name+"()", hash:"session/"+s.id, text:(a.name+" "+(a.desc||"")).toLowerCase()});
    });
    (s.specRefs||[]).forEach(function(r){
      SEARCH_INDEX.push({type:"Specification", label:r.id, hash:"session/"+s.id, text:(r.id+" "+r.text).toLowerCase()});
    });
    (s.concepts||[]).forEach(function(c){
      SEARCH_INDEX.push({type:"Concept", label:c, hash:"session/"+s.id, text:c.toLowerCase()});
    });
  });
  GLOSSARY.forEach(function(g){
    SEARCH_INDEX.push({type:"Glossary", label:g.term, hash:"glossary", text:(g.term+" "+g.def).toLowerCase()});
  });
  OS_OBJECTS.forEach(function(o){
    SEARCH_INDEX.push({type:"OS Object", label:o.name, hash:"session/"+o.session, text:(o.name+" "+o.purpose).toLowerCase()});
  });
})();

function runSearch(q){
  q = q.trim().toLowerCase();
  if(q.length<2) return [];
  var scored = [];
  SEARCH_INDEX.forEach(function(item){
    var idx = item.text.indexOf(q);
    if(idx>=0){
      var score = (item.label.toLowerCase().indexOf(q)===0) ? 0 : (idx===0?1:2);
      scored.push({item:item, score:score});
    }
  });
  scored.sort(function(a,b){ return a.score-b.score; });
  return scored.slice(0,30).map(function(s){ return s.item; });
}
function renderSearchResults(results, q){
  var box = document.getElementById("searchResults");
  if(!results.length){
    box.innerHTML = '<div class="sr-item muted">Không tìm thấy kết quả cho "'+esc(q)+'"</div>';
    box.classList.add("show");
    return;
  }
  var groups = {};
  results.forEach(function(r){ (groups[r.type]=groups[r.type]||[]).push(r); });
  var html = "";
  Object.keys(groups).forEach(function(g){
    html += '<div class="sr-group">'+esc(g)+'</div>';
    groups[g].forEach(function(item){
      html += '<a class="sr-item" href="#'+item.hash+'" data-search-nav="'+item.hash+'"><b>'+esc(item.label)+'</b></a>';
    });
  });
  box.innerHTML = html;
  box.classList.add("show");
}

/* ============================================================
   DYNAMIC CONTENT WIRING (re-run after every route render)
   ============================================================ */
function wireDynamicContent(){
  // accordions
  document.querySelectorAll("[data-acc-toggle]").forEach(function(head){
    head.onclick = function(){
      head.closest(".accordion").classList.toggle("open");
    };
  });
  // copy buttons
  document.querySelectorAll(".copy-btn").forEach(function(btn){
    btn.onclick = function(){
      var target = document.getElementById(btn.getAttribute("data-copy-target"));
      if(!target) return;
      var text = target.textContent;
      if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
      var old = btn.textContent; btn.textContent="Copied!";
      setTimeout(function(){ btn.textContent = old; }, 1200);
    };
  });
  // bookmark buttons
  document.querySelectorAll("[data-bookmark-session]").forEach(function(btn){
    btn.onclick = function(){
      var id = parseInt(btn.getAttribute("data-bookmark-session"),10);
      var label = btn.getAttribute("data-bookmark-label");
      toggleBookmark("session", id, label);
      onHashChange();
    };
  });
  // progress buttons
  document.querySelectorAll("[data-progress-session]").forEach(function(btn){
    btn.onclick = function(){
      var id = parseInt(btn.getAttribute("data-progress-session"),10);
      cycleProgress(id);
      renderSidebar();
      onHashChange();
    };
  });
  // quiz hint toggles
  document.querySelectorAll("[data-qz-hint]").forEach(function(btn){
    btn.onclick = function(){
      var hint = btn.nextElementSibling;
      hint.style.display = hint.style.display==="block" ? "none" : "block";
    };
  });
  // quiz reviewed checkboxes
  document.querySelectorAll("[data-qz-check]").forEach(function(cb){
    cb.onchange = function(){
      var wrap = cb.closest(".qz");
      var sessionId = parseInt(wrap.getAttribute("data-qz-session"),10);
      var idx = parseInt(wrap.getAttribute("data-qz-idx"),10);
      toggleReviewed(sessionId, idx);
      wrap.classList.toggle("reviewed", cb.checked);
      renderSidebar();
    };
  });
  // concept chip click -> search
  document.querySelectorAll("[data-search-term]").forEach(function(chip){
    chip.onclick = function(){
      var term = chip.getAttribute("data-search-term");
      document.getElementById("searchInput").value = term;
      renderSearchResults(runSearch(term), term);
      document.getElementById("searchInput").focus();
    };
  });
  // API index filter
  var apiFilter = document.getElementById("apiFilterInput");
  if(apiFilter){
    apiFilter.oninput = function(){
      var q = apiFilter.value.toLowerCase();
      document.querySelectorAll(".api-row").forEach(function(row){
        row.style.display = row.getAttribute("data-name").indexOf(q)>=0 ? "" : "none";
      });
    };
  }
  // Glossary filter
  var gFilter = document.getElementById("glossaryFilterInput");
  if(gFilter){
    gFilter.oninput = applyGlossaryFilter;
  }
  document.querySelectorAll("[data-gcat]").forEach(function(btn){
    btn.onclick = function(){
      document.querySelectorAll("[data-gcat]").forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      applyGlossaryFilter();
    };
  });
}
function applyGlossaryFilter(){
  var q = (document.getElementById("glossaryFilterInput")||{value:""}).value.toLowerCase();
  var activeBtn = document.querySelector("[data-gcat].active");
  var cat = activeBtn ? activeBtn.getAttribute("data-gcat") : "all";
  document.querySelectorAll(".glossary-item").forEach(function(el){
    var matchesText = !q || el.getAttribute("data-term").indexOf(q)>=0;
    var matchesCat = cat==="all" || el.getAttribute("data-cat")===cat;
    el.style.display = (matchesText && matchesCat) ? "" : "none";
  });
}

window.addEventListener("scroll", updateScrollUI);
function updateScrollUI(){
  var scrollTop = window.scrollY || document.documentElement.scrollTop;
  var scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
  var pct = scrollHeight>0 ? Math.min(100, Math.round(100*scrollTop/scrollHeight)) : 0;
  document.getElementById("progressBar").style.width = pct+"%";
  var toTop = document.getElementById("toTop");
  if(scrollTop>400) toTop.classList.add("show"); else toTop.classList.remove("show");
}
document.getElementById("toTop").onclick = function(){ window.scrollTo({top:0,behavior:"smooth"}); };
